opponent_tracker_node:
  ros__parameters:
    input_topic: "/dynamic_points"
    target_frame: "map"

    clustering:
      voxel_size: 0.08             # [m] Spatial hash voxel resolution
      cluster_tolerance: 0.20      # [m] Euclidean clustering neighbor radius
      min_cluster_size: 15         # Minimum points for valid opponent cluster
      max_cluster_size: 10000      # Maximum points

    robot:
      min_width: 0.20              # [m] Min bounding box width
      max_width: 1.30              # [m] Max bounding box width (Rule 3.2.2: 1200mm)
      min_depth: 0.20              # [m] Min bounding box depth
      max_depth: 1.30              # [m] Max bounding box depth (Rule 3.2.2: 1200mm)
      min_height: 0.30             # [m] Min bounding box height
      max_height: 2.20             # [m] Max bounding box height (Rule 3.2.2: 1800mm + bucket)
      max_ground_z: 0.25           # [m] Floor grounding check in map frame

    bucket:
      min_z: 1.15                  # [m] Min mobile bucket height (Rule 3.2.3: 1200mm)
      max_z: 2.15                  # [m] Max mobile bucket height (Rule 3.2.3: 2100mm)

    field:
      min_x: -6.0                  # [m] CAD Map coordinate system bounds
      max_x: 6.0
      min_y: -6.5
      max_y: 6.5

    court:
      opponent_side: "auto"        # "auto" (detect based on self robot position), "side_a" (Y > 0), "side_b" (Y < 0)
      court_y_divider: 0.0         # [m] Center divider Y coordinate
      center_barrier_margin: 0.30  # [m] Margin to exclude center podium/barrier points

    kalman:
      process_noise_pos: 2.0       # Position/Acceleration process noise (high agility)
      process_noise_vel: 5.0       # Velocity process noise
      process_noise_z: 0.2         # Bucket height process noise
      measurement_noise_pos: 0.02  # LiDAR measurement noise (high confidence in direct scan)
      measurement_noise_z: 0.02    # Bucket height measurement noise
      max_association_dist: 2.0    # [m] Association distance threshold
      max_missed_frames: 10        # Frames before track loss
      min_hits_to_confirm: 2       # Hits to confirm tracking
      min_hits_to_confirm: 3       # Hits to confirm tracking (filters transient noise)

